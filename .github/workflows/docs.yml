name: Docs

# The docs site (decision 004), deployed to GitHub Pages on every push to master: https://pgcast.dev/.
# A PR builds it in ci.yml (job `docs`) and never deploys. Pages takes its source from "GitHub Actions": no gh-pages branch.
on:
  push:
    branches: [master]

permissions: {}

# One deploy at a time; one that has started finishes, and a newer push waits for it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages reads the Pages settings, and fails if Pages is not on.
      pages: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the whole history: each page's "Last updated" and its sitemap `lastmod` come from git
      # No npm cache: what is deployed is built from the lock file alone.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      # the site installs the built library (`file:..`)
      - run: npm ci && npm run build
        working-directory: .
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
