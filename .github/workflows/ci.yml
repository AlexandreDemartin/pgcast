name: CI

on:
  push:
    branches: [master]
  # Every PR, including a layer of a stack whose base is the branch below it (skill pr-shape, § Stacking).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  changes:
    # Draft PRs run nothing: the CI starts with `gh pr ready` (skill ci-gate).
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Is there anything besides docs to check?
        # Markdown outside .agents/ and .claude/ needs no build: those two hold the agent method, which check:agents checks.
        # The docs site builds on a change to website/ (its pages are Markdown too), to src/, which its examples use, to
        # what builds the library it installs (the root package.json, package-lock.json, tsconfig.json), or to the workflows.
        # A push to master always runs everything.
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          code=true
          docs=true
          if [ "$EVENT" = pull_request ]; then
            code=false
            docs=false
            while IFS= read -r file; do
              case "$file" in
                '') ;;
                website/*) docs=true ;;
                src/*|package.json|package-lock.json|tsconfig.json|.github/workflows/*) code=true; docs=true ;;
                .agents/*|.claude/*) code=true ;;
                *.md) ;;
                *) code=true ;;
              esac
            done <<< "$(git diff --name-only "origin/$BASE...HEAD")"
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
          echo "docs=$docs" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, lts/*]
        postgres: [14, 16, 18]

    # Integration tests create and drop their own pgcast_test_* databases (test/helpers).
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgcast
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pgcast

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check:agents
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:types
      - run: npm run build
      - name: Committed ESM wrappers match the build
        run: git diff --exit-code -- db.mjs generate.mjs

  bench-types:
    # No Postgres: bench/ compiles the committed test/generated/ schema.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run bench:types

  docs:
    # The docs site, a package of its own (decision 004): its build fails on a dead link or a type error in an example.
    # It installs the built library (`file:..`), so the root is built first. docs.yml deploys it from master.
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    # docs:schema loads schema.sql into its own pgcast_test_<pid>_docs database.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgcast
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pgcast

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci && npm run build
        working-directory: .
      - run: npm ci
      - name: Committed docs schema types match schema.sql
        # --intent-to-add: a new file the generator writes (a custom type placeholder) shows in the diff too.
        run: |
          npm run docs:schema
          git add --intent-to-add zapatos
          git diff --exit-code -- zapatos
      - run: npm run docs:build

  ci-passed:
    # The one check master requires: it stays stable when the matrix changes, and passes when docs-only skips the rest.
    name: CI passed
    needs: [changes, build, bench-types, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed, or was skipped on purpose
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.build.result }} ${{ needs.bench-types.result }} ${{ needs.docs.result }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A job ended with: $result"; exit 1 ;;
            esac
          done
