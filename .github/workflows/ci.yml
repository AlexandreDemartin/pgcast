name: CI

on:
  push:
    branches: [master]
  # Every PR, including a layer of a stack whose base is the branch below it (skill pr-shape, § Stacking).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  changes:
    # Draft PRs run nothing: the CI starts with `gh pr ready` (skill ci-gate).
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        name: Is there anything besides docs to check?
        # Markdown outside .agents/ and .claude/ needs no build: those two hold the agent method, which check:agents checks,
        # as it checks AGENTS.md § Architecture and recounts the summary of docs/CHARACTERISATION-REPORT.md.
        # The docs site builds on a change to website/ (its pages are Markdown too), to CHANGELOG.md, its /changelog page, to
        # src/, which its examples use, to adapters/*/src/, which its Drivers page compiles against, to what builds the library
        # it installs (the root package.json, package-lock.json, tsconfig.json), or to the workflows.
        # A push to master always runs everything.
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          code=true
          docs=true
          if [ "$EVENT" = pull_request ]; then
            code=false
            docs=false
            while IFS= read -r file; do
              case "$file" in
                '') ;;
                website/*|CHANGELOG.md) docs=true ;;
                src/*|adapters/*/src/*|package.json|package-lock.json|tsconfig.json|.github/workflows/*) code=true; docs=true ;;
                .agents/*|.claude/*|AGENTS.md|docs/CHARACTERISATION-REPORT.md) code=true ;;
                *.md) ;;
                *) code=true ;;
              esac
            done <<< "$(git diff --name-only "origin/$BASE...HEAD")"
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"
          echo "docs=$docs" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, lts/*]
        postgres: [14, 16, 18, 19]

    # Integration tests create and drop their own pgcast_test_* databases (test/helpers).
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgcast
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pgcast

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check:agents
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:types
      - run: npm run build
      - name: Committed ESM wrappers match the build
        run: git diff --exit-code -- db.mjs generate.mjs

  release-dry-run:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ['.', adapters/postgres-js, adapters/pglite]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Make a sample tag for an unpublished version
        working-directory: ${{ matrix.folder }}
        env:
          FOLDER: ${{ matrix.folder }}
        run: |
          version=$(node -p 'require("./package.json").version')
          npm version --no-git-tag-version --ignore-scripts "${version%%+*}-ci.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          prefix=v
          if [[ "$FOLDER" != . ]]; then prefix="$(node -p 'require("./package.json").name')@"; fi
          echo "TAG=$prefix$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
      - name: Check the tag resolves to the package under test
        id: package
        env:
          EXPECTED: ${{ matrix.folder }}
        run: |
          folder=$(node scripts/release-folder.mjs "$TAG")
          test "$folder" = "$EXPECTED"
          echo "folder=$folder" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - if: steps.package.outputs.folder != '.'
        working-directory: ${{ steps.package.outputs.folder }}
        run: npm ci --ignore-scripts
      - run: npm publish --dry-run --tag ci --access public
        working-directory: ${{ steps.package.outputs.folder }}

  bench-types:
    # No Postgres: bench/ compiles the committed test/generated/ schema.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run bench:types

  typescript-7:
    # A consumer project on TypeScript 7 compiles the generated schema: the committed test/generated/, no Postgres.
    # The declarations of src/db come from the pinned TypeScript, as published; only `tsc -p test/generated` runs on 7.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npx tsc --emitDeclarationOnly --outDir node_modules/.cache/pgcast
      - run: npx -p typescript@7.0.2 tsc --version
      - run: npx -p typescript@7.0.2 tsc -p test/generated

  typescript-4-1:
    # The floor of the typescript peer (>=4.1): every .d.ts the package ships parses with TypeScript 4.1.6, and a consumer
    # on it compiles against them and the committed test/generated/ schema, with skipLibCheck (website/install.md), and
    # their lib check finds no error but Buffer<ArrayBuffer>. The script fetches TypeScript 4.1.6 and its pinned @types
    # into node_modules/.cache, never a dependency; no Postgres.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:floor

  docs:
    # The docs site, a package of its own (decision 004): its build fails on a dead link or a type error in an example.
    # It installs the built library (`file:..`), so the root is built first. docs.yml deploys it from master.
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15  # a hang the examples' own time limit misses holds the runner up to GitHub's 6 h
    defaults:
      run:
        working-directory: website

    # docs:schema and docs:examples load schema.sql into their own pgcast_test_<pid>_docs database, on the oldest
    # Postgres of the matrix.
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgcast
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pgcast

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # built as docs.yml deploys it: each page's "Last updated" comes from git
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci && npm run build
        working-directory: .
      - name: Lint the site's scripts and code too
        # the build job lints them on a change outside website/; a PR to website/ alone runs only this job
        run: npm run lint
        working-directory: .
      - run: npm ci
      - name: Committed docs schema types match schema.sql
        # --intent-to-add: a new file the generator writes (a custom type placeholder) shows in the diff too.
        run: |
          npm run docs:schema
          git add --intent-to-add zapatos
          git diff --exit-code -- zapatos
      - name: Each deprecation message of src/ has its CHANGELOG.md line, and no entry is written twice
        # check:agents runs them too; here they also cover a change to CHANGELOG.md alone
        run: node scripts/check-deprecations.mjs && node scripts/check-changelog-entries.mjs
        working-directory: .
      - name: Every example runs against Postgres
        run: npm run docs:examples
      - run: npm run docs:build

  adapter-postgres-js:
    # The postgres.js adapter, a package of its own (adapters/postgres-js/): its tests read and write each type through pg
    # and through the adapter on the fixture's database, with the root's install and helpers, so the root builds first;
    # its type test compiles against the root's db.d.ts. On its peer's floor, the lockfile's version, and the first and
    # the latest 4.x.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [14, 18, 19]
        driver: [3.4.0, lockfile, 4.0.0, 4.1.1]
    defaults:
      run:
        working-directory: adapters/postgres-js
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgcast
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pgcast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            adapters/postgres-js/package-lock.json
      - run: npm ci && npm run build
        working-directory: .
      - run: npm ci
      - name: postgres.js ${{ matrix.driver }}
        if: matrix.driver != 'lockfile'
        env:
          DRIVER: ${{ matrix.driver }}
        run: npm install --no-save "postgres@$DRIVER"
      - run: npm run build
      - run: npm test
      - run: npm run test:types
      - name: The package holds each path of its files, main and types
        run: |
          npm pack --dry-run --json --ignore-scripts | node -e "
            const packed = JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].files.map(f => f.path);
            const { files, main, types } = require('./package.json');
            const missing = [...files, main, types].filter(f => !packed.some(p => p === f || p.startsWith(f + '/')));
            console.log(packed.sort().join('\\n'));
            if (missing.length > 0) { console.error('Not in the package: ' + missing.join(', ')); process.exit(1); }"

  adapter-pglite:
    # The PGlite adapter, a package of its own (adapters/pglite/): its tests read and write each type through pg on the
    # fixture's database and through the adapter on a PGlite with the same fixture, with the root's install and helpers,
    # so the root builds first; then its build is bundled for a page. On its peer's floor, the docs site's version and
    # the lockfile's.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [14, 18, 19]
        pglite: [0.5.0, 0.5.13, lockfile]
    defaults:
      run:
        working-directory: adapters/pglite
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgcast
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pgcast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            adapters/pglite/package-lock.json
      - run: npm ci && npm run build
        working-directory: .
      - run: npm ci
      - name: PGlite ${{ matrix.pglite }}
        if: matrix.pglite != 'lockfile'
        env:
          PGLITE: ${{ matrix.pglite }}
        run: npm install --no-save "@electric-sql/pglite@$PGLITE"
      - run: npm run build
      - run: npm test
      - run: npm run test:types
      - name: The build bundles for a page, with no Node built-in
        run: npm run check:browser
      - name: The package holds each path of its files, main and types
        run: |
          npm pack --dry-run --json --ignore-scripts | node -e "
            const packed = JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].files.map(f => f.path);
            const { files, main, types } = require('./package.json');
            const missing = [...files, main, types].filter(f => !packed.some(p => p === f || p.startsWith(f + '/')));
            console.log(packed.sort().join('\\n'));
            if (missing.length > 0) { console.error('Not in the package: ' + missing.join(', ')); process.exit(1); }"

  typegen:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [14, 16, 18, 19]
        pg: [8.6.0, lockfile]
    defaults:
      run:
        working-directory: tools/typegen
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgcast
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pgcast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/typegen/package-lock.json
      - run: npm ci && npm run build
        working-directory: .
      - run: npm ci
      - name: Install the pg peer floor
        if: matrix.pg != 'lockfile'
        env:
          DRIVER: ${{ matrix.pg }}
        run: npm install --no-save --package-lock=false "pg@$DRIVER"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Check the exact package contents
        run: |
          npm pack --dry-run --json --ignore-scripts | node -e "
            const paths = JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].files.map(f => f.path).sort();
            require('assert/strict').deepEqual(paths, ['CHANGELOG.md', 'LICENCE', 'README.md', 'dist/describe.js', 'package.json']);"

  ci-passed:
    # The one check master requires: it stays stable when the matrix changes, and passes when docs-only skips the rest.
    name: CI passed
    needs: [changes, build, release-dry-run, bench-types, typescript-7, typescript-4-1, docs, adapter-postgres-js, adapter-pglite, typegen]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed, or was skipped on purpose
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.build.result }} ${{ needs.release-dry-run.result }} ${{ needs.bench-types.result }} ${{ needs.typescript-7.result }} ${{ needs.typescript-4-1.result }} ${{ needs.docs.result }} ${{ needs.adapter-postgres-js.result }} ${{ needs.adapter-pglite.result }} ${{ needs.typegen.result }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A job ended with: $result"; exit 1 ;;
            esac
          done
