name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build:
    # Draft PRs run nothing: the CI starts with `gh pr ready` (skill ci-gate).
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, lts/*]
        postgres: [14, 16, 18]

    # Integration tests create and drop their own pgcast_test_* databases (test/helpers).
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgcast
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pgcast

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check:agents
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:types
      - run: npm run build
      - name: Committed ESM wrappers match the build
        run: git diff --exit-code -- db.mjs generate.mjs
