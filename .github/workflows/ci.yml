name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  changes:
    # Draft PRs run nothing: the CI starts with `gh pr ready` (skill ci-gate).
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Is there anything besides docs to check?
        # Markdown outside .agents/ and .claude/ needs no build: those two hold the agent method, which check:agents checks.
        # A push to master always runs everything.
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            code=false
            while IFS= read -r file; do
              case "$file" in
                '') ;;
                .agents/*|.claude/*) code=true ;;
                *.md) ;;
                *) code=true ;;
              esac
            done <<< "$(git diff --name-only "origin/$BASE...HEAD")"
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, lts/*]
        postgres: [14, 16, 18]

    # Integration tests create and drop their own pgcast_test_* databases (test/helpers).
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgcast
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pgcast

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check:agents
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:types
      - run: npm run build
      - name: Committed ESM wrappers match the build
        run: git diff --exit-code -- db.mjs generate.mjs

  bench-types:
    # No Postgres: bench/ compiles the committed test/generated/ schema.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run bench:types

  ci-passed:
    # The one check master requires: it stays stable when the matrix changes, and passes when docs-only skips the rest.
    name: CI passed
    needs: [changes, build, bench-types]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed, or was skipped on purpose
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.build.result }} ${{ needs.bench-types.result }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A job ended with: $result"; exit 1 ;;
            esac
          done
