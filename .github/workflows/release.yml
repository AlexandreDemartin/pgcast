name: Release

# Publish the package named by a release tag with npm trusted publishing and provenance.
# The protected npm environment gives the owner the final say before publication (docs/WORKFLOW.md § Releases).
on:
  push:
    tags: ['v*', '@pgcast/*@*']

permissions: {}

jobs:
  publish:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    environment: npm
    concurrency: release-${{ github.ref_name }}
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check the tag is on master
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: Find the package whose name and version match the tag
        id: package
        run: |
          folder=$(node scripts/release-folder.mjs "$TAG")
          echo "folder=$folder" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - if: steps.package.outputs.folder != '.'
        working-directory: ${{ steps.package.outputs.folder }}
        run: npm ci --ignore-scripts
      - run: npm publish --provenance --access public
        working-directory: ${{ steps.package.outputs.folder }}
