<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pgcast Docs Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: docs app. Sticky top bar, left nav, reading column (~68ch), right "on this page" rail.
   The signature is the cast panel: what you write -> what Postgres runs -> what TypeScript knows. */
:root{
  --bg:#f6f8f9; --surface:#ffffff; --sunken:#eef2f4; --fg:#12202b; --muted:#566673; --line:#d9e0e5;
  --accent:#0a6b63; --accent-fg:#ffffff; --accent-soft:#dcefec; --warn:#8a5a00; --warn-soft:#fbf0d9;
  --code-bg:#f1f4f6; --k:#1458a8; --s:#8f5600; --t:#0a6b63; --n:#b0245a; --c:#7a8794; --qi:#12202b; --p:#b0245a;
  --font-display:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius:10px; --top:56px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1318; --surface:#121a21; --sunken:#0a0f13; --fg:#e2e9ee; --muted:#8d9eab; --line:#23303a;
  --accent:#4fcfbf; --accent-fg:#06201d; --accent-soft:#11302c; --warn:#e8b65a; --warn-soft:#2c2412;
  --code-bg:#0f171d; --k:#7fb6ff; --s:#e3b462; --t:#4fcfbf; --n:#f08ab3; --c:#6c7d8a; --qi:#e2e9ee; --p:#f08ab3;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0d1318; --surface:#121a21; --sunken:#0a0f13; --fg:#e2e9ee; --muted:#8d9eab; --line:#23303a;
  --accent:#4fcfbf; --accent-fg:#06201d; --accent-soft:#11302c; --warn:#e8b65a; --warn-soft:#2c2412;
  --code-bg:#0f171d; --k:#7fb6ff; --s:#e3b462; --t:#4fcfbf; --n:#f08ab3; --c:#6c7d8a; --qi:#e2e9ee; --p:#f08ab3;
  color-scheme:dark }

*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--top) + 24px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 var(--font-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code,kbd,pre{font-family:var(--font-mono)}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;text-wrap:balance;letter-spacing:-.01em}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--top);background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:0;font:700 19px/1 var(--font-mono);color:var(--fg);text-decoration:none;letter-spacing:-.02em}
.brand b{color:var(--accent);font-weight:700;margin:0 1px}
.ver{font:500 12px/1 var(--font-body);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 8px;background:var(--surface)}
.top .grow{flex:1}
.searchbtn{display:flex;align-items:center;gap:10px;min-width:0;width:min(320px,40vw);height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--sunken);color:var(--muted);font:inherit;font-size:14px;cursor:pointer}
.searchbtn span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--surface);color:var(--muted)}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);cursor:pointer}
.iconbtn svg{width:18px;height:18px}
.toplinks{display:flex;gap:16px;font-size:14px}
.toplinks a{color:var(--muted);text-decoration:none}
.toplinks a:hover{color:var(--fg)}
.menubtn{display:none}

.banner{font-size:13px;color:var(--warn);background:var(--warn-soft);border-bottom:1px solid var(--line);padding-block:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* shell */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr) 220px;max-width:1360px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell.home{grid-template-columns:minmax(0,1fr)}
.nav{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - var(--top));overflow:auto;padding:28px 20px 40px 0;border-right:1px solid var(--line)}
.shell.home .nav,.shell.home .toc{display:none}
.nav h4{font:600 11px/1 var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px}
.nav h4:first-child{margin-top:0}
.nav a{display:flex;justify-content:space-between;gap:8px;padding:5px 10px;margin:1px 0;border-radius:7px;color:var(--fg);text-decoration:none;font-size:14px}
.nav a:hover{background:var(--sunken)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a small{font-size:11px;color:var(--muted);font-weight:500}
main{min-width:0;padding:36px 48px 80px}
.shell.home main{padding:0}
.toc{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));align-self:start;padding:36px 0 40px 8px;font-size:13px}
.toc h4{font:600 11px/1 var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.toc a{display:block;color:var(--muted);text-decoration:none;padding:4px 0 4px 12px;border-left:1px solid var(--line)}
.toc a:hover{color:var(--fg)}
.toc a.on{color:var(--accent);border-left-color:var(--accent)}

/* article */
.article{max-width:72ch}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:8px}
.article h1{font-size:2.3rem;margin:0 0 12px;font-weight:800}
.lede{font-size:1.1rem;color:var(--muted);margin:0 0 28px;max-width:62ch}
.article h2{font-size:1.45rem;margin:44px 0 12px;font-weight:700;padding-top:4px}
.article h3{font-size:1.1rem;margin:28px 0 8px;font-weight:700}
.article p,.article li{max-width:68ch}
.article ul{padding-left:20px}
:not(pre)>code{font-size:.88em;background:var(--sunken);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.anchor{color:var(--line);text-decoration:none;margin-left:8px;font-weight:500;opacity:0}
h2:hover .anchor,h3:hover .anchor{opacity:1}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:56px}
.pager a{display:block;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;text-decoration:none;color:var(--fg);background:var(--surface)}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block;color:var(--muted);font-size:12px}
.pager .next{text-align:right}
.editrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}

/* code */
.code{position:relative;margin:16px 0 20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--code-bg);min-width:0}
.code .bar{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line);padding:0 6px 0 12px;height:38px}
.code .bar .label{font:500 12px/1 var(--font-body);color:var(--muted);margin-right:auto}
.tab{font:500 12px/1 var(--font-mono);color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;height:38px;padding:0 10px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.copy{font:500 12px/1 var(--font-body);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;cursor:pointer;margin-left:6px}
.copy:hover{color:var(--fg)}
pre{margin:0;padding:14px 16px;overflow-x:auto;font-size:13px;line-height:1.6;tab-size:2}
.tk-k{color:var(--k)} .tk-s{color:var(--s)} .tk-t{color:var(--t)} .tk-n{color:var(--n)} .tk-c{color:var(--c);font-style:italic} .tk-qi{color:var(--qi)} .tk-p{color:var(--p);font-weight:700}
.tw{border-bottom:1px dashed var(--muted);cursor:help}
.tw:hover,.tw:focus{background:var(--accent-soft);outline:none;border-radius:2px}
.values{font:12px/1.5 var(--font-mono);color:var(--muted);border-top:1px dashed var(--line);padding:8px 16px}
.values b{color:var(--p);font-weight:700}

/* the cast panel */
.cast{display:grid;grid-template-columns:1.15fr 1.2fr .85fr;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;margin:20px 0 28px}
.cast>div{min-width:0;display:flex;flex-direction:column;border-right:1px dashed var(--line)}
.cast>div:last-child{border-right:0}
.cast h5{display:flex;align-items:center;gap:8px;margin:0;padding:12px 16px 10px;font:600 12px/1 var(--font-body);color:var(--muted);letter-spacing:.02em;border-bottom:1px solid var(--line)}
.cast h5 em{font:700 11px/1 var(--font-mono);font-style:normal;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:3px 6px}
.cast pre{background:transparent;flex:1}
.cast .values{margin-top:auto}
.cast-caption{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:-16px;margin-bottom:28px}

/* callouts, tables, chips */
.note{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:14px 16px;margin:20px 0}
.note .chip{grid-row:span 2;align-self:start}
.note p{margin:0}
.note.warn{background:var(--warn-soft)}
.chip{display:inline-block;font:600 11px/1 var(--font-body);letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:5px 8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.chip.plain{background:var(--sunken);color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);margin:16px 0 24px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px/1.3 var(--font-body);color:var(--muted);background:var(--sunken)}
tr:last-child td{border-bottom:0}
td code{white-space:nowrap}
.mono{font-family:var(--font-mono);font-size:13px;font-variant-numeric:tabular-nums}

/* home */
.hero{padding-block:72px 40px;max-width:1180px;margin:0 auto}
.eyebrow{font:500 13px/1 var(--font-mono);color:var(--accent);margin:0 0 18px}
.hero h1{font-size:clamp(2.3rem,5.4vw,4rem);font-weight:800;margin:0 0 18px;max-width:16ch;letter-spacing:-.025em}
.hero h1 .op{font-family:var(--font-mono);color:var(--accent);font-weight:700;letter-spacing:-.06em}
.hero .lede{font-size:1.18rem;max-width:58ch}
.ctas{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:8px 0 0}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:9px;font-weight:600;text-decoration:none;border:1px solid var(--line);color:var(--fg);background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.install{display:flex;align-items:center;gap:10px;height:42px;padding:0 6px 0 14px;border:1px solid var(--line);border-radius:9px;background:var(--code-bg);font:13px var(--font-mono);min-width:0}
.install code{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.install .dollar{color:var(--muted)}
.homegrid{max-width:1180px;margin:0 auto;padding-bottom:80px}
.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;margin:44px 0 56px;padding-top:28px;border-top:1px solid var(--line)}
.pillars h3{font-size:1rem;margin:0 0 6px}
.pillars p{margin:0;color:var(--muted);font-size:14px}
.readnext{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.readnext a{border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-decoration:none;color:var(--fg);background:var(--surface)}
.readnext a:hover{border-color:var(--accent)}
.readnext small{display:block;color:var(--muted);margin-top:4px;font-size:13px}
.homefoot{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:20px;margin-top:56px}

/* search dialog + tooltip */
.dialog{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--fg) 30%,transparent);display:grid;place-items:start center;
  padding-top:calc(12vh + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dialog .box{width:min(600px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.dialog input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);font:16px var(--font-body);padding:16px 18px;outline:none}
.results{max-height:50vh;overflow:auto;padding:6px}
.results a{display:block;padding:10px 12px;border-radius:8px;color:var(--fg);text-decoration:none}
.results a small{display:block;color:var(--muted);font-size:12px}
.results a.sel,.results a:hover{background:var(--accent-soft)}
.results .empty{padding:16px;color:var(--muted)}
.tip{position:fixed;z-index:60;max-width:min(560px,92vw);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.18);
  padding:8px 10px;font:12.5px/1.5 var(--font-mono);white-space:pre-wrap;pointer-events:none}

@media (max-width:1200px){ .shell{grid-template-columns:240px minmax(0,1fr)} .toc{display:none} }
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .nav{position:fixed;z-index:40;top:calc(var(--top) + env(safe-area-inset-top,0px));left:0;bottom:0;width:min(300px,86vw);max-height:none;background:var(--surface);
    padding:24px 16px 40px max(16px,env(safe-area-inset-left,0px));transform:translateX(-105%);transition:transform .2s ease;border-right:1px solid var(--line)}
  .nav.open{transform:none}
  .shell.home .nav{display:block}
  .menubtn{display:grid}
  main{padding:28px 0 64px}
  .toplinks{display:none}
  .cast{grid-template-columns:minmax(0,1fr)}
  .cast>div{border-right:0;border-bottom:1px dashed var(--line)}
  .cast>div:last-child{border-bottom:0}
  .pillars{grid-template-columns:repeat(2,minmax(0,1fr))}
  .readnext{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .searchbtn{width:36px;padding:0;justify-content:center} .searchbtn span,.searchbtn kbd{display:none}
  .ver{display:none}
  .pillars{grid-template-columns:minmax(0,1fr)}
  .pager{grid-template-columns:minmax(0,1fr)}
  .hero{padding-block:44px 28px}
  .article h1{font-size:1.9rem}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;scroll-behavior:auto!important} }
</style>
</head>
<body>
<header class="top">
  <button class="iconbtn menubtn" id="menubtn" aria-label="Open the menu" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="#home" aria-label="pgcast home">pg<b>::</b>cast</a>
  <span class="ver" title="Version shown in these docs">6.6.2</span>
  <span class="grow"></span>
  <button class="searchbtn" id="searchbtn" aria-label="Search the docs">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span>Search the docs</span><kbd>⌘K</kbd>
  </button>
  <nav class="toplinks" aria-label="Project links">
    <a href="#install">Docs</a>
    <a href="https://github.com/AlexandreDemartin/pgcast/blob/master/CHANGELOG.md" target="_blank" rel="noopener">Changelog</a>
    <a href="https://github.com/AlexandreDemartin/pgcast" target="_blank" rel="noopener">GitHub</a>
  </nav>
  <button class="iconbtn" id="themebtn" aria-label="Colour theme: system"></button>
</header>
<div class="banner">Prototype of the pgcast documentation, a design study for Epic #85. Only Install, select() and Opt-ins are written; the examples are illustrative.</div>

<div class="shell" id="shell">
  <nav class="nav" id="nav" aria-label="Documentation"></nav>
  <main id="main"></main>
  <aside class="toc" id="toc" aria-label="On this page"></aside>
</div>

<div class="dialog" id="dialog" hidden role="dialog" aria-modal="true" aria-label="Search">
  <div class="box">
    <input id="q" type="search" placeholder="Search pages and sections" autocomplete="off" aria-label="Search pages and sections">
    <div class="results" id="results"></div>
  </div>
</div>
<div class="tip" id="tip" hidden></div>

<script>
(function(){
"use strict";

/* ---------- navigation outline (the site map proposed for Epic #85) ---------- */
var NAV = [
  {group:"Getting started", items:[
    {id:"install", title:"Install"},
    {id:"configure", title:"Configure"},
    {id:"generate", title:"Generate your schema"},
    {id:"import", title:"Import it"}]},
  {group:"Guide", items:[
    {id:"sql-template", title:"The sql template"},
    {id:"select", title:"select()"},
    {id:"insert", title:"insert() and upsert()"},
    {id:"conditions", title:"Conditions"},
    {id:"lateral", title:"Lateral joins"},
    {id:"transactions", title:"Transactions"},
    {id:"errors", title:"Errors"}]},
  {group:"pgcast", items:[
    {id:"switching", title:"Switching from Zapatos"},
    {id:"opt-ins", title:"Opt-ins", badge:"6.7"},
    {id:"security", title:"Security notes"},
    {id:"versions", title:"Versions"}]},
  {group:"Reference", items:[
    {id:"runtime-config", title:"Run-time configuration"},
    {id:"utility-types", title:"Utility types"}]}
];
var FLAT = [];
NAV.forEach(function(g){ g.items.forEach(function(i){ i.group = g.group; FLAT.push(i); }); });

/* ---------- a small highlighter; ⟨text¦type⟩ marks a hover type, as Twoslash would compute it ---------- */
var KW = {
  ts: "const let await async import from type export function return new as typeof keyof extends interface true false null undefined",
  sql:"SELECT FROM WHERE AS AND OR NOT NULL LEFT JOIN LATERAL ON ORDER BY DESC ASC LIMIT OFFSET INSERT INTO VALUES UPDATE SET ROW DO CONFLICT RETURNING TRUE FALSE DEFAULT EXCLUDED CAST",
  sh: "npm npx pnpm yarn install add"
};
var KWS = {}; Object.keys(KW).forEach(function(l){ KWS[l] = {}; KW[l].split(" ").forEach(function(w){ KWS[l][w] = 1; }); });
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function tok(src, lang){
  var re = lang === "sql"
    ? /(--[^\n]*|'(?:[^']|'')*'|"(?:[^"]|"")*"|\$\d+|\b\d+(?:\.\d+)?\b|\b[A-Za-z_][\w$]*\b)/g
    : /(\/\/[^\n]*|#[^\n]*|'(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"|`[^`]*`|\b\d+(?:\.\d+)?\b|\b[A-Za-z_][\w$]*\b)/g;
  var out = "", last = 0, m;
  while ((m = re.exec(src))){
    out += esc(src.slice(last, m.index)); last = re.lastIndex;
    var t = m[0], c = null;
    if (/^(\/\/|--|#)/.test(t)) c = (lang === "ts" && t[0] === "#") ? null : "c";
    else if (lang === "sql" && t[0] === '"') c = "qi";
    else if (/^['"`]/.test(t)) c = "s";
    else if (/^\$\d/.test(t)) c = "p";
    else if (/^\d/.test(t)) c = "n";
    else if (KWS[lang] && KWS[lang][lang === "sql" ? t.toUpperCase() : t] && (lang !== "sql" || t === t.toUpperCase())) c = "k";
    else if (lang === "ts" && /^[A-Z]/.test(t)) c = "t";
    else if (lang === "type" && /^[A-Za-z]/.test(t) && !/^(string|number|boolean|null|Date)$/.test(t)) c = "t";
    else if (lang === "type") c = "k";
    out += c ? '<span class="tk-' + c + '">' + esc(t) + "</span>" : esc(t);
  }
  return out + esc(src.slice(last));
}
